name: Publish n8n community node

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Require tag to match package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== require("./package.json").version) process.exit(1)'
      - run: npm publish --access public --provenance
